<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CBSE Class 10 History Competency Test</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f12;
      color: #f5f5f5;
    }

    .container {
      max-width: 760px;
      margin: auto;
      padding: 18px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    h1 {
      font-size: 24px;
      margin: 0;
    }

    .subtitle {
      color: #aaa;
      font-size: 14px;
      margin-top: 5px;
    }

    .card {
      background: #18181d;
      border: 1px solid #303038;
      border-radius: 16px;
      padding: 18px;
    }

    .meta {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 15px;
    }

    .tag {
      background: #25252c;
      border: 1px solid #3b3b44;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      color: #ccc;
    }

    .progress-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 10px;
      font-size: 14px;
      color: #ccc;
    }

    .progress {
      height: 8px;
      background: #27272e;
      border-radius: 99px;
      overflow: hidden;
      margin-bottom: 18px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: #fff;
      transition: width 0.25s ease;
    }

    .question {
      font-size: 18px;
      line-height: 1.5;
      font-weight: 700;
      margin-bottom: 16px;
    }

    .source {
      background: #222228;
      border: 1px solid #383842;
      border-radius: 12px;
      padding: 14px;
      color: #ddd;
      margin-bottom: 15px;
      line-height: 1.5;
      display: none;
    }

    .option {
      width: 100%;
      display: block;
      background: #232329;
      color: white;
      border: 1px solid #3a3a43;
      border-radius: 12px;
      padding: 14px;
      margin: 10px 0;
      text-align: left;
      font-size: 15px;
      cursor: pointer;
    }

    .option:hover {
      background: #2b2b33;
    }

    .option.correct {
      border: 2px solid #56c271;
      background: #17301f;
    }

    .option.wrong {
      border: 2px solid #e36565;
      background: #341d1d;
    }

    .option:disabled {
      cursor: default;
      opacity: 1;
    }

    .feedback {
      display: none;
      background: #202026;
      border: 1px solid #383842;
      border-radius: 12px;
      padding: 14px;
      margin-top: 15px;
      line-height: 1.5;
    }

    .next-btn,
    .share-btn,
    .restart-btn {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .next-btn {
      background: white;
      color: black;
      display: none;
    }

    .share-btn {
      width: auto;
      margin-top: 0;
      background: #25252c;
      color: white;
      border: 1px solid #3b3b44;
    }

    .restart-btn {
      background: white;
      color: black;
    }

    .result {
      display: none;
      text-align: center;
    }

    .result-score {
      font-size: 42px;
      font-weight: 800;
      margin: 18px 0 8px;
    }

    .result-text {
      color: #bbb;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      h1 {
        font-size: 20px;
      }

      .question {
        font-size: 17px;
      }

      .share-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>
  <div class="container">

    <div class="topbar">
      <div>
        <h1>Class 10 History Challenge</h1>
        <div class="subtitle">
          CBSE Board syllabus • Competency MCQs • Assertion–Reason
        </div>
      </div>

      <button class="share-btn" id="shareBtn">
        Share Test
      </button>
    </div>

    <div class="progress-row">
      <span id="progressText">Question 1 / 25</span>
      <span id="scoreText">Score: 0</span>
    </div>

    <div class="progress">
      <div class="progress-fill" id="progressFill"></div>
    </div>

    <div class="card" id="quizCard">

      <div class="meta">
        <span class="tag" id="chapterTag"></span>
        <span class="tag" id="typeTag"></span>
      </div>

      <div class="source" id="sourceBox"></div>

      <div class="question" id="questionText"></div>

      <div id="options"></div>

      <div class="feedback" id="feedback"></div>

      <button class="next-btn" id="nextBtn">
        Next Question
      </button>

    </div>

    <div class="card result" id="resultCard">

      <h2>Test Complete 🎯</h2>

      <div class="result-score" id="finalScore"></div>

      <div class="result-text" id="finalText"></div>

      <button class="restart-btn" id="restartBtn">
        Restart Test
      </button>

    </div>

  </div>

<script>

const questions = [

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Competency MCQ",
question:
"A historian argues that nationalism became powerful when people began imagining themselves as members of a shared community. Which development best supports this idea?",
options: [
"Restoration of conservative monarchies after 1815",
"Use of folk songs, language and traditions by Romantic artists",
"Expansion of European colonies",
"Growth of dynastic marriages"
],
answer: 1,
explanation:
"Romanticism helped create shared cultural identities through language, folklore and traditions."
},

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Assertion–Reason",
question:
"Assertion (A): The French Revolution transferred sovereignty from the monarch to French citizens. Reason (R): Ideas such as la patrie and le citoyen promoted a collective national identity.",
options: [
"Both A and R are true, and R correctly explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 0,
explanation:
"The ideas of fatherland and citizen reflected sovereignty shifting from monarchy to the people."
},

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Case-based",
source:
"A merchant travelling through German-speaking territories repeatedly pays customs duties while moving between several small states.",
question:
"Which development most directly addressed this problem?",
options: [
"Zollverein",

"Treaty of Constantinople"
],
answer: 0,
explanation:
"The Zollverein removed tariff barriers between many German states and encouraged economic unity."
},

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Higher-order MCQ",
question:
"Why did the Frankfurt Parliament fail to achieve German unification?",
options: [
"It received no support from the middle classes",
"It lacked military power and monarchs rejected its authority",

"It supported French domination"
],
answer: 1,
explanation:
"The parliament had political ideals but lacked military power. The Prussian king rejected its offer of the crown."
},

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Competency MCQ",
question:
"Which situation best represents a nation-state?",
options: [
"A territory ruled by unrelated dynasties without shared identity",
"A state whose citizens broadly share a common political identity",
"An empire where only nobles have rights",
"A territory united only through military occupation"
],
answer: 1,
explanation:
"A nation-state connects political boundaries with a broadly shared sense of national identity."
},

{
chapter: "Ch 1 • Nationalism in Europe",
type: "Assertion–Reason",
question:
"Assertion (A): The Balkans became an area of intense conflict. Reason (R): Nationalism, Ottoman decline and rivalry among European powers operated simultaneously there.",
options: [
"Both A and R are true, and R correctly explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 0,
explanation:
"Competing nationalities, weakening Ottoman control and Great Power rivalry made the Balkans highly unstable."
},

{
chapter: "Ch 2 • Nationalism in India",
type: "Competency MCQ",
question:
"Why did Gandhi withdraw the Non-Cooperation Movement after Chauri Chaura?",
options: [

answer: 1,

chapter: "Ch 2 • Nationalism in India",
type: "Assertion–Reason",
question:
"Assertion (A): Different groups joined the Civil Disobedience Movement with different expectations. Reason (R): Swaraj had exactly the same meaning for every participant.",
options: [
"Both A and R are true, and R explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 2,
explanation:

},

{
chapter: "Ch 2 • Nationalism in India",
type: "Case-based",
source:

question:
"Which groups experienced a similar situation during the Civil Disobedience Movement?",
options: [

],
answer: 0,
explanation:
"Rich peasants such as Patidars and Jats were badly affected by falling agricultural prices and high revenue demands."

{
chapter: "Ch 2 • Nationalism in India",
type: "Application MCQ",
question:

options: [

],
answer: 1,
explanation:
"Salt was used by everyone, making the colonial salt tax a universally relatable injustice."
},

{
chapter: "Ch 2 • Nationalism in India",
type: "Source-based",
source:
"A plantation worker believes swaraj means being free to move outside the plantation and return to his village.",
question:
"What does this reveal?",
options: [
"Everyone understood swaraj identically",
"Local experiences shaped people's understanding of freedom",
"Plantation workers rejected nationalism",
"Only Congress leaders understood swaraj"
],
answer: 1,
explanation:
"Different groups connected the wider idea of swaraj with their own specific grievances."
},

{
chapter: "Ch 2 • Nationalism in India",
type: "Competency MCQ",
question:
"What made the Rowlatt Act particularly controversial?",
options: [
"It expanded voting rights",
"It allowed detention without trial and continued wartime repression",

"It granted complete independence"
],
answer: 1,
explanation:
"The Act allowed the government to imprison political activists without trial."
},

{
chapter: "Ch 2 • Nationalism in India",
type: "Assertion–Reason",
question:
"Assertion (A): Bharat Mata became an important nationalist symbol. Reason (R): It personified India and helped people imagine the nation as a sacred collective identity.",
options: [
"Both A and R are true, and R correctly explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 0,
explanation:
"Bharat Mata transformed the abstract idea of India into an emotional visual symbol."
},

{
chapter: "Ch 3 • Global World 1–1.3",
type: "Competency MCQ",
question:
"The movement of potatoes from the Americas to Europe demonstrates that:",
options: [
"Global exchange began only after industrialisation",
"Food and ideas moved between continents long before modern globalisation",
"Pre-modern societies were completely isolated",
"Only luxury goods were traded"
],
answer: 1,
explanation:
"Trade, migration and cultural exchange connected distant societies long before modern globalisation."
},

{
chapter: "Ch 3 • Global World 1–1.3",
type: "Application MCQ",
question:
"A historian studies Chinese pottery, Indian textiles and spices moving between Asia, Europe and North Africa. Which network is being described?",
options: [
"Atlantic triangular trade",
"Silk Routes",
"Bretton Woods system",
"Industrial railway network"
],
answer: 1,
explanation:
"The Silk Routes linked distant regions through economic and cultural exchange."
},

{
chapter: "Ch 3 • Global World 1–1.3",
type: "Assertion–Reason",
question:
"Assertion (A): Disease helped Europeans conquer the Americas. Reason (R): Indigenous populations lacked immunity to diseases such as smallpox.",
options: [
"Both A and R are true, and R correctly explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 0,
explanation:
"Smallpox devastated indigenous communities and greatly assisted European conquest."
},

{
chapter: "Ch 3 • Global World 1–1.3",
type: "Case-based",
source:
"A crop brought from the Americas becomes a cheap source of nutrition for Europe's poor and contributes to population growth.",
question:
"Which crop is being described?",
options: [
"Tea",
"Potato",
"Coffee",
"Cotton"
],
answer: 1,
explanation:
"The potato became an important and inexpensive food source in Europe."
},

{
chapter: "Ch 3 • Global World 1–1.3",
type: "Higher-order MCQ",
question:
"Why are pre-modern trade routes historically important?",
options: [

"They moved goods, beliefs, people, knowledge and disease",
"They linked only Europe and America",
"They began after steamships were invented"
],
answer: 1,
explanation:
"Trade routes carried cultural, economic and biological exchanges across vast regions."
},

{
chapter: "Ch 5 • Print Culture",
type: "Competency MCQ",
question:
"Why did rulers and religious authorities sometimes fear print?",
options: [

],
answer: 1,
explanation:
"Print allowed ideas and criticism to reach much larger audiences."
},

{
chapter: "Ch 5 • Print Culture",
type: "Assertion–Reason",
question:
"Assertion (A): Martin Luther's ideas spread rapidly. Reason (R): Printing enabled his writings to be reproduced and circulated widely.",
options: [
"Both A and R are true, and R correctly explains A",
"Both A and R are true, but R does not explain A",
"A is true, but R is false",
"A is false, but R is true"
],
answer: 0,
explanation:
"Print dramatically accelerated the spread of Luther's writings and Reformation ideas."
},

{
chapter: "Ch 5 • Print Culture",
type: "Case-based",
source:
"A reformer publishes cheap pamphlets in a vernacular language to encourage ordinary people to debate social and religious practices.",
question:
"Which effect of print does this illustrate?",
options: [
"Print narrowed public debate",
"Print widened participation in social and religious discussion",
"Print worked only in elite languages",
"Print immediately destroyed oral traditions"
],
answer: 1,
explanation:
"Cheap vernacular publications brought larger sections of society into public debates."
},

{
chapter: "Ch 5 • Print Culture",
type: "Higher-order MCQ",
question:
"Why did print culture not immediately replace oral culture?",
options: [
"Printed texts were often read aloud and interacted with oral traditions",
"All printed books were banned",
"Printers refused to sell books",
"Oral traditions disappeared before printing"
],
answer: 0,
explanation:
"Printed texts were frequently read aloud, so oral and print cultures continued to interact."
},

{
chapter: "Ch 5 • Print Culture",
type: "Application MCQ",
question:
"A colonial government introduces laws to monitor newspapers after criticism of official policies increases. What larger tension does this demonstrate?",
options: [
"Conflict between growing public opinion and state censorship",
"End of political debate",
"Collapse of vernacular newspapers",
"End of nationalism"
],
answer: 0,
explanation:
"The growth of print-based political debate often led colonial governments to impose censorship."
},

{
chapter: "Mixed Board Syllabus",
type: "Chronology",
question:
"Choose the correct chronological order.",
options: [
"French Revolution → Congress of Vienna → Non-Cooperation Movement → Civil Disobedience Movement",
"Congress of Vienna → French Revolution → Civil Disobedience → Non-Cooperation",
"French Revolution → Non-Cooperation → Congress of Vienna → Civil Disobedience",
"Congress of Vienna → Civil Disobedience → French Revolution → Non-Cooperation"
],
answer: 0,
explanation:
"1789 → 1815 → 1920–22 → 1930 onward."
},

{
chapter: "Mixed Board Syllabus",
type: "Final Challenge",
question:
"Which idea best connects Romantic nationalism, Bharat Mata and print culture?",
options: [
"Symbols and communication can transform abstract political ideas into collective identities",

"Economic change has no connection with nationalism",
"Nationalism develops identically everywhere"
],
answer: 0,
explanation:
"Culture, imagery and communication helped people imagine and emotionally identify with nations."
}

];

let currentQuestion = 0;
let score = 0;
let locked = false;

const questionText = document.getElementById("questionText");
const chapterTag = document.getElementById("chapterTag");
const typeTag = document.getElementById("typeTag");
const sourceBox = document.getElementById("sourceBox");
const optionsBox = document.getElementById("options");
const feedback = document.getElementById("feedback");
const nextBtn = document.getElementById("nextBtn");

const progressText = document.getElementById("progressText");
const progressFill = document.getElementById("progressFill");
const scoreText = document.getElementById("scoreText");

const quizCard = document.getElementById("quizCard");
const resultCard = document.getElementById("resultCard");

function loadQuestion() {

  locked = false;

  const q = questions[currentQuestion];

  progressText.textContent =
    `Question ${currentQuestion + 1} / ${questions.length}`;

  scoreText.textContent =
    `Score: ${score}`;

  progressFill.style.width =
    `${((currentQuestion + 1) / questions.length) * 100}%`;

  chapterTag.textContent = q.chapter;
  typeTag.textContent = q.type;

  questionText.textContent = q.question;

  if (q.source) {

    sourceBox.style.display = "block";
    sourceBox.textContent = q.source;

  } else {

    sourceBox.style.display = "none";

  }

  optionsBox.innerHTML = "";

  feedback.style.display = "none";

  nextBtn.style.display = "none";

  q.options.forEach((option, index) => {

    const button = document.createElement("button");

    button.className = "option";

    button.textContent =
      `${String.fromCharCode(65 + index)}. ${option}`;

    button.addEventListener("click", () => {

      selectAnswer(
        index,
        button
      );

    });

    optionsBox.appendChild(button);

  });

}


function selectAnswer(selectedIndex, selectedButton) {

  if (locked) return;

  locked = true;

  const q = questions[currentQuestion];

  const buttons =
    document.querySelectorAll(".option");

  buttons.forEach((button, index) => {

    button.disabled = true;

    if (index === q.answer) {

      button.classList.add("correct");

    }

  });


  if (selectedIndex === q.answer) {

    score++;

    feedback.innerHTML =
      `<strong>Correct ✅</strong><br><br>${q.explanation}`;

  } else {

    selectedButton.classList.add("wrong");

    feedback.innerHTML =
      `<strong>Incorrect ❌</strong><br><br>
      Correct answer: ${String.fromCharCode(65 + q.answer)}<br><br>
      ${q.explanation}`;

  }


  scoreText.textContent =
    `Score: ${score}`;

  feedback.style.display = "block";

  nextBtn.style.display = "block";


  if (currentQuestion === questions.length - 1) {

    nextBtn.textContent =
      "See Final Result";

  } else {

    nextBtn.textContent =
      "Next Question";

  }

}


nextBtn.addEventListener("click", () => {

  if (currentQuestion < questions.length - 1) {

    currentQuestion++;

    loadQuestion();

  } else {

    showResult();

  }

});


function showResult() {

  quizCard.style.display = "none";

  resultCard.style.display = "block";

  const percentage =
    Math.round(
      (score / questions.length) * 100
    );


  document.getElementById("finalScore")
    .textContent =
    `${score} / ${questions.length}`;


  let message = "";


  if (percentage >= 92) {

    message =
      "Outstanding. Your History concepts are at a very strong board level. 🔥";

  }

  else if (percentage >= 80) {

    message =
      "Excellent. You're handling competency-based questions very well.";

  }

  else if (percentage >= 68) {

    message =
      "Good score. Revise the concepts behind your mistakes and retake.";

  }

  else if (percentage >= 52) {

    message =
      "Decent base, but you need more NCERT-based competency practice.";

  }

  else {

    message =
      "Revise the NCERT carefully and try the test again.";

  }


  document.getElementById("finalText")
    .textContent = message;

}


document.getElementById("restartBtn")
  .addEventListener("click", () => {

    currentQuestion = 0;

    score = 0;

    resultCard.style.display = "none";

    quizCard.style.display = "block";

    loadQuestion();

  });


document.getElementById("shareBtn")
  .addEventListener("click", async () => {

    const shareData = {

      title:
        "CBSE Class 10 History Competency Test",

      text:
        "Try this Class 10 History competency-based MCQ test!",

      url:
        window.location.href

    };


    try {

      if (navigator.share) {

        await navigator.share(
          shareData
        );

      } else {

        prompt(
          "Copy this test link:",
          window.location.href
        );

      }

    }

    catch (error) {

      console.log(
        "Share cancelled"
      );

    }

  });


loadQuestion();

</script>

</body>
</html>
